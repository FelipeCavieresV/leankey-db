name: leankey
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: leankey
      POSTGRES_USER: ${POSTGRES_USER:-leanley}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d leankey']
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ../leankey-back
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-leanley}:${POSTGRES_PASSWORD}@db:5432/leankey
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:8080"]'
      STORAGE_DIR: /data/files
      TIMEZONE: America/Santiago
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - files_data:/data/files
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    profiles: [web]
    build: ../leankey-front
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
  files_data:
